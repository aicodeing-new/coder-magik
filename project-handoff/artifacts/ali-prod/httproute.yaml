apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  namespace: coder
spec:
  parentRefs:
    - name: magik-gw
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - coder.magikcloud.cn
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coder
          port: 80
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-https-redirect
  namespace: coder
spec:
  parentRefs:
    - name: magik-gw
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - coder.magikcloud.cn
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
