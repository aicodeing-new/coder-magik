# Apply to yunqiao; TLS terminates on the existing magik-gw Gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: coder-networking
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: derp-yunqiao-state
  namespace: coder-networking
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-fs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: derp-yunqiao
  namespace: coder-networking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: derp-yunqiao
  template:
    metadata:
      labels:
        app: derp-yunqiao
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: yunqiao-cpu-22
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: derper
        image: harbor.magikcloud.cn/library/derper:coder-e42b84b-amd64
        imagePullPolicy: IfNotPresent
        args:
        - -a=:8080
        - -hostname=yunqiao-derp.magikcloud.cn
        - -c=/var/lib/derper/derper.json
        - -http-port=-1
        - -stun=false
        - -verify-clients=false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /derp/probe
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /derp/probe
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /derp/probe
            port: http
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: state
          mountPath: /var/lib/derper
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: derp-yunqiao-state
---
apiVersion: v1
kind: Service
metadata:
  name: derp-yunqiao
  namespace: coder-networking
spec:
  selector:
    app: derp-yunqiao
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: derp-yunqiao
  namespace: coder-networking
spec:
  parentRefs:
  - name: magik-gw
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - yunqiao-derp.magikcloud.cn
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 0s
      backendRequest: 0s
    backendRefs:
    - name: derp-yunqiao
      port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: derp-yunqiao-upgrades
  namespace: coder-networking
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: derp-yunqiao
  httpUpgrade:
  - type: websocket
  - type: derp
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 0s
