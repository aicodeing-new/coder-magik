# 同步自 2026-10-12 线上实际状态(以线上为准),镜像版本指向 v1.0.4。
# 与线上差异的历史漂移已并入:CODER_ENTERPRISE_HARDCODE_LICENSE(此前 kubectl 直加)。
# 不含任何 Secret 明文,仅引用 Secret 名称。
coder:
  image:
    repo: swr.cn-north-4.myhuaweicloud.com/pixiu-public/admins/coder-magik
    tag: v1.0.4-amd64
    pullPolicy: IfNotPresent
  replicaCount: 1
  command:
  - /opt/coder
  commandArgs:
  - server
  nodeSelector:
    kubernetes.io/arch: amd64
  podSecurityContext:
    fsGroup: 1000
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi
  serviceAccount:
    workspacePerms: false
  service:
    type: ClusterIP
  env:
  - name: CODER_ADDRESS
    value: 0.0.0.0:8080
  - name: CODER_ACCESS_URL
    value: https://coder.magikcloud.cn
  - name: CODER_PG_CONNECTION_URL
    valueFrom:
      secretKeyRef:
        name: coder-db-url
        key: url
  - name: CODER_ENTERPRISE_HARDCODE_LICENSE
    value: 'true'
  - name: TZ
    value: Asia/Shanghai
  - name: CODER_TELEMETRY_ENABLE
    value: 'false'
  - name: CODER_UPDATE_CHECK
    value: 'false'
  - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
    value: 'false'
  - name: CODER_PROVISIONER_DAEMONS
    value: '2'
  - name: TF_CLI_CONFIG_FILE
    value: /etc/terraform/terraform.rc
  - name: CODER_OIDC_CLIENT_ID
    value: coder
  - name: CODER_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: coder-sso-private
        key: CODER_OIDC_SECRET
  - name: CODER_OIDC_ISSUER_URL
    value: https://coder.magikcloud.cn/sso
  - name: CODER_OIDC_SCOPES
    value: openid,profile,email
  - name: CODER_OIDC_AUTH_URL_PARAMS
    value: '{}'
  - name: CODER_OIDC_IGNORE_EMAIL_VERIFIED
    value: 'true'
  - name: CODER_OIDC_SIGN_IN_TEXT
    value: 使用飞书登录
  - name: CODER_OIDC_ALLOW_SIGNUPS
    value: 'true'
  volumes:
  - name: gpu-kubeconfig
    secret:
      secretName: coder-gpu-kubeconfig
  - name: terraform-providers
    persistentVolumeClaim:
      claimName: coder-terraform-providers
  - name: terraform-config
    configMap:
      name: coder-terraform-config
  volumeMounts:
  - name: gpu-kubeconfig
    mountPath: /mnt/secrets/kube
    readOnly: true
  - name: terraform-providers
    mountPath: /opt/terraform-providers
    readOnly: true
  - name: terraform-config
    mountPath: /etc/terraform
    readOnly: true
